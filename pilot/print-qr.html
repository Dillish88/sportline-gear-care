<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sportline — shop pilot QR posters</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eee;font:16px/1.6 Arial,sans-serif;color:#20231f}.controls{max-width:760px;margin:20px auto;padding:20px}button{background:#d92e25;color:white;border:0;padding:15px 25px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:default}.sheet{width:210mm;min-height:297mm;padding:23mm 18mm;margin:20px auto;background:#f7f6f0;text-align:center;display:flex;align-items:center;flex-direction:column}.logo{width:160px;background:#08090b;padding:8px}.eyebrow{font-size:12px;letter-spacing:2px;color:#d92e25;margin-top:35px}h1{font-size:52px;line-height:1.04;letter-spacing:-2px;margin:15px 0}h2{font-size:21px}p{max-width:540px}.qr{width:80mm;height:80mm;background:white;margin:18px}.qr svg{width:100%;height:100%}.url{font-size:11px;overflow-wrap:anywhere;max-width:165mm}.steps{border-block:1px solid #ccd0c3;padding:15px;margin:24px 0}.bottom{margin-top:auto;font-size:13px}.disabled-print{display:none}@media(max-width:800px){.sheet{width:100%;min-height:800px;padding:30px 20px}h1{font-size:40px}}@media print{.controls{display:none}.sheet{margin:0;width:210mm;height:297mm;break-after:page}.sheet:last-child{break-after:auto}body{background:white}@page{size:A4;margin:0}body:not(.ready) .sheet{display:none}body:not(.ready) .disabled-print{display:block}}</style>
<body><div class="controls"><h2>Shop pilot posters</h2><p id="notice">Checking the published address…</p><button id="print" disabled>Print both shop posters</button><p>Print at 100% scale. Scan each printed QR with a phone on mobile data before putting it up.</p></div><p class="disabled-print">Posters are not ready. Open this page on the live HTTPS booking site after pilot activation.</p><div id="posters"></div><script src="config.js"></script><script src="vendor/qrcode.js"></script><script>
(() => {
 const safe=location.protocol==='https:'&&!['localhost','127.0.0.1','[::1]'].includes(location.hostname)&&window.PILOT_CONFIG.enabled && window.PILOT_CONFIG.qrOrigin === location.origin;
 const notice=document.getElementById('notice');
 if(!safe){notice.textContent='Printing is disabled here. Open /pilot/print-qr.html on the final public HTTPS site after the database is activated. The permanent domain must be confirmed and qrOrigin set in config.js first. A localhost QR will not work on customer phones.';return;}
 const base=new URL('./',location.href);
 ['6th','5th'].forEach(shop=>{
  const url=new URL(base);url.searchParams.set('shop',shop);url.searchParams.set('src','counter-'+shop);url.hash='booking';
  const sheet=document.createElement('section');sheet.className='sheet';
  const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n;};
  const logo=el('img',null,'logo');logo.src='assets/logo.webp';logo.alt='Sportline';
  sheet.append(logo,el('p','SCAN. BOOK. GET BACK IN THE GAME.','eyebrow'),el('h1','Give your gear\nsome care.'),el('p','Badminton restringing · Cricket bat care'));
  const qr=qrcode(0,'H');qr.addData(url.href);qr.make();const image=el('div',null,'qr');image.innerHTML=qr.createSvgTag({cellSize:5,margin:20,scalable:true});sheet.append(image);
  sheet.append(el('div',url.href,'url'),el('p','1. Scan and choose your repair\n2. Save your request\n3. Show your job number at the counter','steps'));
  const footer=el('div',null,'bottom');footer.append(el('h2','Sportline · '+shop+' Avenue'),el('p',shop==='6th'?'2, R-Block, 6th Ave West, Anna Nagar':'265, 5th Ave, Z Block, Anna Nagar'),el('p','10am–9pm · +91 80564 36668'),el('p','The counter team confirms the work and price. Pay on collection.'));sheet.append(footer);document.getElementById('posters').append(sheet);
 });
 notice.textContent='These codes point to '+base.href+'. Use this permanent address throughout the pilot.';
 document.body.classList.add('ready');document.getElementById('print').disabled=false;document.getElementById('print').onclick=()=>window.print();
})();
</script></body></html>
