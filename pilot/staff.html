<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sportline — counter queue</title><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="pilot.css"><link rel="stylesheet" href="assets/refinements.css"><body>
<main class="staff-shell"><header class="staff-header"><div><h1>The counter</h1><p>New requests in. Repaired gear out. One step at a time.</p></div><button id="logout" class="secondary" hidden>Sign out</button></header><p id="staff-error" class="error" role="alert" hidden></p>
<form id="login" class="login-card"><h2>Staff sign-in</h2><p>Use your approved Sportline staff account.</p><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="signin">Sign in →</button><p class="field-help">An account must be approved for this pilot. A customer login does not grant access.</p></form>
<section id="dashboard" hidden><nav class="queue-tabs" aria-label="Job views"><button type="button" data-view="active" aria-pressed="true">All active <span></span></button><button type="button" data-view="Requested" aria-pressed="false">New <span></span></button><button type="button" data-view="working" aria-pressed="false">In progress <span></span></button><button type="button" data-view="Ready" aria-pressed="false">Ready <span></span></button></nav><div class="toolbar"><label><span class="sr-only">Search jobs</span><input id="search" placeholder="Search job, customer or mobile" aria-label="Search jobs"></label><label>Shop<select id="shop-filter"><option value="">Both shops</option><option value="6th">6th Avenue</option><option value="5th">5th Avenue</option></select></label><label>Status<select id="status-filter"><option value="active">Active jobs</option><option value="working">In progress</option><option value="Requested">New requests</option><option value="Accepted">Accepted</option><option value="At the bench">At the bench</option><option value="Ready">Ready</option><option value="Collected">Collected today/recently</option><option value="Cancelled">Cancelled today/recently</option></select></label><button id="reload" class="secondary">Refresh ↻</button></div><p class="count-note" id="count" role="status"></p><div id="queue" class="queue"></div><div class="customer-tools"><details><summary>Stop promotional messages for a customer</summary><label>Customer mobile (10 digits)<input id="withdraw-phone" type="tel" maxlength="10"></label><button id="withdraw-offers" class="secondary">Remove offers opt-in</button><p id="withdraw-result" role="status"></p></details></div></section></main><div id="print-label" class="print-label"></div>
<script src="config.js"></script><script src="api.js"></script><script src="staff.js"></script></body></html>
